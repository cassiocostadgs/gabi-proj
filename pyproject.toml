[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["web"]

[tool.coverage.run]
omit = [
    "*/repositories/task_repository.py",  # requires Oracle — not testable in CI
    "*/gabi_engine.py",  # requires real GA files and Oracle — exercised in production only
]

[tool.coverage.report]
fail_under = 80
