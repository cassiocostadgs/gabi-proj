name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gabi_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r web/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check web/ && ruff format --check web/

      - name: Test
        run: python -m pytest -q

  build-frontend:
    name: Frontend — lint + test + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npx eslint src/ --max-warnings=0

      - name: Format check
        run: cd frontend && npx prettier --check src/

      - name: Test
        run: cd frontend && npm run test -- --run

      - name: Build
        run: cd frontend && npm run build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/opt/gabi/frontend/dist/"
          strip_components: 1

      - name: Pull + restart
        uses: appleboy/ssh-action@v1
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SID: ${{ secrets.ORACLE_SID }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_TASK_PROJECT: ${{ secrets.ORACLE_TASK_PROJECT }}
          MAG_EVAL_API_KEY: ${{ secrets.MAG_EVAL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ORACLE_HOST,ORACLE_PORT,ORACLE_SID,ORACLE_USER,ORACLE_PASSWORD,ORACLE_TASK_PROJECT,MAG_EVAL_API_KEY,ANTHROPIC_API_KEY,DATABASE_URL
          script: |
            set -e
            cd /opt/gabi
            printf '%s\n' \
              "ORACLE_HOST=${ORACLE_HOST}" \
              "ORACLE_PORT=${ORACLE_PORT}" \
              "ORACLE_SID=${ORACLE_SID}" \
              "ORACLE_USER=${ORACLE_USER}" \
              "ORACLE_PASSWORD=${ORACLE_PASSWORD}" \
              "ORACLE_TASK_PROJECT=${ORACLE_TASK_PROJECT}" \
              "MAG_EVAL_API_KEY=${MAG_EVAL_API_KEY}" \
              "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" \
              "DATABASE_URL=${DATABASE_URL}" \
              > web/.env
            git fetch git@github-gabi:tiagohlatki-db1/gabi.git main
            git reset --hard FETCH_HEAD
            source venv/bin/activate
            pip install -q -r web/requirements.txt
            sudo systemctl restart gabi
            sudo systemctl reload nginx
            sudo systemctl is-active gabi nginx
